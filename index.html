<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background: skyblue;
    }
    canvas {
        display: block;
        margin: auto;
        background: linear-gradient(skyblue, lightblue);
    }
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

// Responsive canvas
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Bird
let bird = {
    x: 80,
    y: canvas.height / 2,
    size: 20,
    gravity: 0.5,
    lift: -8,
    velocity: 0
};

// Pipes
let pipes = [];
let pipeWidth = 60;
let gap = 150;

// Create pipes
function createPipe() {
    let top = Math.random() * (canvas.height / 2);
    pipes.push({
        x: canvas.width,
        top: top,
        bottom: top + gap
    });
}

// Controls
function jump() {
    bird.velocity = bird.lift;
}

// PC controls
document.addEventListener("keydown", (e) => {
    if (e.code === "Space") jump();
});

// Mobile controls
document.addEventListener("touchstart", jump);
document.addEventListener("click", jump);

// Game loop
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Bird physics
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // Draw bird (circle instead of block)
    ctx.beginPath();
    ctx.arc(bird.x, bird.y, bird.size, 0, Math.PI * 2);
    ctx.fillStyle = "yellow";
    ctx.fill();
    ctx.closePath();

    // Pipes
    for (let i = 0; i < pipes.length; i++) {
        let p = pipes[i];

        p.x -= 3;

        // Draw pipes (proper pipe look)
        ctx.fillStyle = "green";
        ctx.fillRect(p.x, 0, pipeWidth, p.top);
        ctx.fillRect(p.x, p.bottom, pipeWidth, canvas.height);

        // Collision
        if (
            bird.x + bird.size > p.x &&
            bird.x - bird.size < p.x + pipeWidth &&
            (bird.y - bird.size < p.top || bird.y + bird.size > p.bottom)
        ) {
            location.reload();
        }
    }

    // Remove old pipes
    pipes = pipes.filter(p => p.x + pipeWidth > 0);

    // Generate pipes
    if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 250) {
        createPipe();
    }

    // Ground & top collision
    if (bird.y > canvas.height || bird.y < 0) {
        location.reload();
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
