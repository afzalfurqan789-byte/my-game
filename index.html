<!DOCTYPE html>
<html>
<head>
  <title>Flappy Bird Fixed</title>
  <style>
    body {
      margin: 0;
      text-align: center;
      background: #111;
      color: white;
      font-family: Arial;
    }
    canvas {
      background: skyblue;
      display: block;
      margin: auto;
      border: 3px solid white;
    }
  </style>
</head>
<body>

<h2>🐦 Flappy Bird (Fixed)</h2>
<p>Press SPACE to jump | R = restart</p>

<canvas id="game" width="400" height="600"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let bird, pipes, score, gameOver;

function init(){
  bird = { x: 80, y: 250, velocity: 0 };
  pipes = [];
  score = 0;
  gameOver = false;
}

init();

document.addEventListener("keydown", function(e){
  if(e.code === "Space"){
    if(!gameOver) bird.velocity = -8;
  }
  if(e.code === "KeyR"){
    init();
  }
});

function createPipe(){
  let gap = 140;
  let top = Math.random() * 250 + 50;

  pipes.push({
    x: 400,
    top: top,
    bottom: top + gap,
    passed: false
  });
}

setInterval(()=>{
  if(!gameOver) createPipe();
}, 1800);

function update(){
  if(gameOver) return;

  bird.velocity += 0.5;
  bird.y += bird.velocity;

  if(bird.y > 580 || bird.y < 0){
    gameOver = true;
  }

  for(let p of pipes){
    p.x -= 3;

    // collision safe check
    if(
      bird.x < p.x + 50 &&
      bird.x + 30 > p.x &&
      (bird.y < p.top || bird.y > p.bottom)
    ){
      gameOver = true;
    }

    // score fix
    if(!p.passed && p.x + 50 < bird.x){
      score++;
      p.passed = true;
    }
  }

  pipes = pipes.filter(p => p.x > -60);
}

function draw(){
  ctx.clearRect(0,0,400,600);

  // bird
  ctx.fillStyle = "yellow";
  ctx.fillRect(bird.x, bird.y, 25, 25);

  // pipes
  ctx.fillStyle = "green";
  for(let p of pipes){
    ctx.fillRect(p.x, 0, 50, p.top);
    ctx.fillRect(p.x, p.bottom, 50, 600);
  }

  ctx.fillStyle = "black";
  ctx.font = "20px Arial";
  ctx.fillText("Score: " + score, 10, 30);

  if(gameOver){
    ctx.font = "30px Arial";
    ctx.fillText("GAME OVER", 100, 300);
    ctx.font = "16px Arial";
    ctx.fillText("Press R to restart", 120, 340);
  }
}

function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
