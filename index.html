<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy UI</title>

<style>
body { margin:0; overflow:hidden; }
canvas { display:block; }

#ui {
    position: fixed;
    top: 10px;
    right: 10px;
    z-index: 10;
}

button {
    font-size: 18px;
    padding: 8px 12px;
    margin-left: 5px;
    border: none;
    border-radius: 8px;
    background: rgba(0,0,0,0.5);
    color: white;
}
</style>
</head>
<body>

<div id="ui">
    <button onclick="togglePause()">⏸</button>
    <button onclick="restart()">🔁</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// STATE
let gameOver = false;
let paused = false;
let score = 0;

// BIRD
let bird = {
    x: 80,
    y: 200,
    r: 15,
    gravity: 0.5,
    lift: -8,
    velocity: 0
};

// PIPES
let pipes = [];
let gap = 160;
let pipeWidth = 70;

// CONTROLS
function jump() {
    if (!gameOver && !paused) {
        bird.velocity = bird.lift;
    }
}

function restart() {
    bird.y = 200;
    bird.velocity = 0;
    pipes = [];
    score = 0;
    gameOver = false;
    paused = false;
}

function togglePause() {
    if (!gameOver) paused = !paused;
}

// PC
document.addEventListener("keydown", e => {
    if (e.code === "Space") jump();
});

// Mobile tap
document.addEventListener("touchstart", jump);
document.addEventListener("click", jump);

// CREATE PIPE
function createPipe() {
    let top = Math.random() * (canvas.height / 2);
    pipes.push({
        x: canvas.width,
        top: top,
        bottom: top + gap,
        passed: false
    });
}

// DRAW BIRD
function drawBird() {
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.velocity * 0.05);

    ctx.fillStyle = "yellow";
    ctx.beginPath();
    ctx.arc(0,0,bird.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(5,-5,5,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(7,-5,2,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "orange";
    ctx.beginPath();
    ctx.moveTo(10,0);
    ctx.lineTo(20,5);
    ctx.lineTo(10,8);
    ctx.fill();

    ctx.restore();
}

// DRAW PIPE
function drawPipe(p) {
    let grad = ctx.createLinearGradient(p.x,0,p.x+pipeWidth,0);
    grad.addColorStop(0,"#2ecc71");
    grad.addColorStop(1,"#27ae60");

    ctx.fillStyle = grad;
    ctx.fillRect(p.x,0,pipeWidth,p.top);
    ctx.fillRect(p.x,p.bottom,pipeWidth,canvas.height);

    ctx.fillStyle="#1e8449";
    ctx.fillRect(p.x-5,p.top-20,pipeWidth+10,20);
    ctx.fillRect(p.x-5,p.bottom,pipeWidth+10,20);
}

// DRAW UI TEXT
function drawUI() {
    ctx.fillStyle = "white";
    ctx.font = "bold 30px Arial";
    ctx.fillText("Score: " + score, 20, 40);

    if (gameOver) {
        ctx.font = "bold 50px Arial";
        ctx.fillText("GAME OVER", canvas.width/2 - 150, canvas.height/2);

        ctx.font = "25px Arial";
        ctx.fillText("Use Restart Button ↗", canvas.width/2 - 120, canvas.height/2 + 50);
    }

    if (paused) {
        ctx.font = "bold 50px Arial";
        ctx.fillText("PAUSED", canvas.width/2 - 100, canvas.height/2);
    }
}

// GAME LOOP
function update() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // sky
    let sky = ctx.createLinearGradient(0,0,0,canvas.height);
    sky.addColorStop(0,"#70c5ce");
    sky.addColorStop(1,"#c0f0ff");
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    if (!gameOver && !paused) {
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
    }

    drawBird();

    for (let i=0;i<pipes.length;i++) {
        let p = pipes[i];

        if (!paused && !gameOver) p.x -= 3;

        drawPipe(p);

        if (!p.passed && p.x + pipeWidth < bird.x) {
            score++;
            p.passed = true;
        }

        if (
            bird.x + bird.r > p.x &&
            bird.x - bird.r < p.x + pipeWidth &&
            (bird.y - bird.r < p.top || bird.y + bird.r > p.bottom)
        ) {
            gameOver = true;
        }
    }

    pipes = pipes.filter(p => p.x > -pipeWidth);

    if (!paused && !gameOver && (pipes.length === 0 || pipes[pipes.length-1].x < canvas.width - 250)) {
        createPipe();
    }

    ctx.fillStyle="#d35400";
    ctx.fillRect(0,canvas.height-60,canvas.width,60);

    if (bird.y + bird.r > canvas.height-60 || bird.y < 0) {
        gameOver = true;
    }

    drawUI();

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
