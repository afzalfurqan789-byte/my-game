<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird HD</title>

<style>
body {
    margin: 0;
    overflow: hidden;
    background: black;
}
canvas {
    display: block;
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

// LOAD IMAGES
const bg = new Image();
bg.src = "https://i.imgur.com/3e5pQ5F.png"; // sky

const birdImg = new Image();
birdImg.src = "https://i.imgur.com/QZ6XH6M.png"; // bird

const pipeTop = new Image();
pipeTop.src = "https://i.imgur.com/7Qp9Z6T.png";

const pipeBottom = new Image();
pipeBottom.src = "https://i.imgur.com/cv6vG8T.png";

const groundImg = new Image();
groundImg.src = "https://i.imgur.com/YW3F5XG.png";

// BIRD
let bird = {
    x: 80,
    y: 200,
    width: 40,
    height: 30,
    gravity: 0.5,
    lift: -8,
    velocity: 0
};

// PIPES
let pipes = [];
let gap = 170;

// CONTROLS
function jump() {
    bird.velocity = bird.lift;
}

document.addEventListener("keydown", e => {
    if (e.code === "Space") jump();
});

document.addEventListener("touchstart", jump);
document.addEventListener("click", jump);

// CREATE PIPE
function createPipe() {
    let top = Math.random() * (canvas.height / 2);

    pipes.push({
        x: canvas.width,
        top: top,
        bottom: top + gap
    });
}

// GAME LOOP
function update() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // BACKGROUND
    ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);

    // BIRD PHYSICS
    bird.velocity += bird.gravity;
    bird.y += bird.velocity;

    // DRAW BIRD (with rotation 😎)
    ctx.save();
    ctx.translate(bird.x, bird.y);
    ctx.rotate(bird.velocity * 0.05);
    ctx.drawImage(birdImg, -bird.width/2, -bird.height/2, bird.width, bird.height);
    ctx.restore();

    // PIPES
    for (let i = 0; i < pipes.length; i++) {
        let p = pipes[i];

        p.x -= 3;

        ctx.drawImage(pipeTop, p.x, p.top - 320, 60, 320);
        ctx.drawImage(pipeBottom, p.x, p.bottom, 60, 320);

        // COLLISION
        if (
            bird.x + bird.width/2 > p.x &&
            bird.x - bird.width/2 < p.x + 60 &&
            (bird.y - bird.height/2 < p.top || bird.y + bird.height/2 > p.bottom)
        ) {
            location.reload();
        }
    }

    // REMOVE OLD PIPES
    pipes = pipes.filter(p => p.x > -60);

    // CREATE NEW
    if (pipes.length === 0 || pipes[pipes.length - 1].x < canvas.width - 250) {
        createPipe();
    }

    // GROUND
    ctx.drawImage(groundImg, 0, canvas.height - 80, canvas.width, 80);

    // COLLISION WITH GROUND
    if (bird.y + bird.height/2 > canvas.height - 80 || bird.y < 0) {
        location.reload();
    }

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
